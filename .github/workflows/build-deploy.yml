name: Validate theme build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate production build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run bundle

      - name: Lint PHP templates
        run: find theme -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Check homepage hero Tailwind utilities
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          for (const path of ['theme/style.css', 'theme/style-editor.css']) {
            const css = readFileSync(path, 'utf8');
            for (const token of ['.btn-outline', '.btn-gold', '865px', 'object-fit:cover']) {
              if (!css.includes(token)) throw new Error(`Missing hero utility ${token} in ${path}`);
            }
          }
          NODE

      - name: Verify Feature Grid fields and responsive utilities
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const group = JSON.parse(readFileSync('theme/acf-json/group_balt_feature_grid.json', 'utf8'));
          const block = JSON.parse(readFileSync('theme/blocks/feature-grid/block.json', 'utf8'));
          const repeater = group.fields.find(field => field.name === 'items');
          if (block.name !== 'balt/feature-grid' || repeater?.min !== 1 || repeater?.max !== 6) {
            throw new Error('Feature Grid name or ACF item limits are incorrect');
          }
          const fields = new Map(repeater.sub_fields.map(field => [field.name, field.type]));
          for (const [name, type] of [['icon', 'font-awesome'], ['heading', 'text'], ['description', 'textarea'], ['link', 'link']]) {
            if (fields.get(name) !== type) throw new Error('Missing Feature Grid ACF field: ' + name);
          }
          if (repeater.sub_fields.find(field => field.name === 'icon')?.save_format !== 'class') {
            throw new Error('Font Awesome field must return icon classes');
          }

          for (const path of ['theme/style.css', 'theme/style-editor.css']) {
            const css = readFileSync(path, 'utf8');
            for (const token of ['grid-cols-6', 'col-span-2', 'col-span-3', '336px', 'bg-surface']) {
              if (!css.includes(token)) throw new Error('Feature Grid Tailwind utility missing: ' + token + ' in ' + path);
            }
          }
          NODE

      - name: Verify featured banner slider fields and Tailwind styling
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const fields = JSON.parse(readFileSync('theme/acf-json/group_dpi_feature_banner.json', 'utf8'));
          const block = JSON.parse(readFileSync('theme/dpi-blocks/blocks/feature-banner/block.json', 'utf8'));
          if (block.name !== 'dpi/feature-banner' || fields.fields.length !== 1) {
            throw new Error('Feature Banner registration or field simplification failed');
          }

          const slides = fields.fields[0];
          if (slides.name !== 'slides' || slides.min !== 1 || slides.max !== 5) {
            throw new Error('Featured slides must have a 1–5 limit');
          }
          const expected = ['image', 'eyebrow', 'headline', 'content', 'buttons'];
          if (slides.sub_fields.map(field => field.name).join(',') !== expected.join(',')) {
            throw new Error('Featured slide fields differ from the expected fields');
          }
          const buttons = slides.sub_fields.find(field => field.name === 'buttons');
          if (buttons.max !== 2) throw new Error('Expected at most two buttons');

          const markup = readFileSync('theme/dpi-blocks/blocks/feature-banner/render.php', 'utf8');
          const interactions = readFileSync('theme/assets/ported-dpi/js/blocks.js', 'utf8');
          for (const attribute of ['data-dpi-feature-banner', 'data-dpi-feature-prev', 'data-dpi-feature-next']) {
            if (!markup.includes(attribute) || !interactions.includes(attribute)) {
              throw new Error('Feature Banner navigation missing: ' + attribute);
            }
          }
          if (!markup.includes("'arrows'         => false") || !markup.includes('slick-dots_li.slick-active_button')) {
            throw new Error('Feature Banner controls or active pagination styling incorrect');
          }
          for (const token of ['data-dpi-slick', 'btn btn-gold', 'btn btn-outline', "array_slice( get_field( 'slides' ) ?: array(), 0, 5 )"]) {
            if (!markup.includes(token)) throw new Error('Featured slider output missing: ' + token);
          }
          for (const path of ['theme/style.css', 'theme/style-editor.css']) {
            const css = readFileSync(path, 'utf8');
            for (const token of ['748px', '.slick-dots', '.slick-active', 'bg-secondary']) {
              if (!css.includes(token)) throw new Error('Featured slider Tailwind missing: ' + token + ' in ' + path);
            }
          }
          NODE

      - name: Verify Image CTA Grid ACF and styling
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const fields = JSON.parse(readFileSync('theme/acf-json/group_balt_image_cta_grid.json', 'utf8'));
          const block = JSON.parse(readFileSync('theme/blocks/image-cta-grid/block.json', 'utf8'));
          const renderer = readFileSync('theme/blocks/image-cta-grid/render.php', 'utf8');
          if (block.name !== 'balt/image-cta-grid' || block.acf.renderCallback !== 'balt_render_image_cta_grid_block') {
            throw new Error('Image CTA Grid registration is incorrect');
          }
          const repeater = fields.fields.find(field => field.name === 'items');
          if (repeater?.type !== 'repeater' || repeater.min !== 4 || repeater.max !== 4) {
            throw new Error('Image CTA Grid requires exactly four cards');
          }
          const fieldsByName = new Map(repeater.sub_fields.map(field => [field.name, field.type]));
          for (const [name, type] of [['image', 'image'], ['label', 'text'], ['link', 'link']]) {
            if (fieldsByName.get(name) !== type) throw new Error('Image CTA Grid card field missing: ' + name);
          }
          for (const name of ['eyebrow', 'heading', 'description', 'cta']) {
            if (!fields.fields.some(field => field.name === name)) {
              throw new Error('Image CTA Grid panel field missing: ' + name);
            }
          }
          for (const token of ['flex-col-reverse', 'desktop:flex-col', 'mx-auto grid w-full grid-cols-1 gap-2 sm:grid-cols-2', 'aspect-[3/4]', 'sm:aspect-auto', 'mb-8', 'desktop:mb-0', 'match ( count( $items ) )', 'grid-cols-1 max-w-[350px]', 'max-w-[708px]', 'desktop:grid-cols-3', 'desktop:grid-cols-4', 'desktop:-mt-20', '$index % count( $badge_colors )', 'bg-[#BE2026]', 'bg-[#B8892B]', 'bg-[#4A90B8]', 'bg-[#4B5563]']) {
            if (!renderer.includes(token)) throw new Error('Image CTA Grid layout missing: ' + token);
          }
          const desktopToken = '--breakpoint-desktop: 62rem;';
          if (!readFileSync('tailwind/tailwind-theme.css', 'utf8').includes(desktopToken)) {
            throw new Error('Missing named 992px desktop breakpoint');
          }
          for (const css of ['theme/style.css', 'theme/style-editor.css']) {
            if (!readFileSync(css, 'utf8').includes('460px')) {
              throw new Error('Image CTA Grid 460px card utility missing: ' + css);
            }
          }
          NODE

      - name: Verify Media Center post types and tabbed block
        run: |
          node --check theme/blocks/media-center/view.js
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const types = ['campaign', 'event', 'podcast', 'video', 'press', 'letter', 'homily'];
          const source = readFileSync('theme/inc/media-post-types.php', 'utf8');
          for (const type of types) {
            if (!source.includes("'balt_" + type + "'")) throw new Error('Missing media post type: ' + type);
          }
          for (const token of ["register_post_type(", "register_taxonomy(", "'show_in_rest'", "'has_archive'", "'thumbnail'"]) {
            if (!source.includes(token)) throw new Error('Media post types missing: ' + token);
          }

          const block = JSON.parse(readFileSync('theme/blocks/media-center/block.json', 'utf8'));
          const group = JSON.parse(readFileSync('theme/acf-json/group_balt_media_center.json', 'utf8'));
          const render = readFileSync('theme/blocks/media-center/render.php', 'utf8');
          const script = readFileSync('theme/blocks/media-center/view.js', 'utf8');
          const sources = readFileSync('theme/inc/media-center.php', 'utf8');
          for (const token of ['balt_media_center_source_choices', 'acf/load_field/key=field_balt_media_center_tab_source', 'get_post_types(', 'get_object_taxonomies(', 'get_terms(', 'get_term_link(', 'is_object_in_taxonomy(']) {
            if (!sources.includes(token)) throw new Error('Media Center category/type source handler missing: ' + token);
          }
          for (const token of ["get_field( 'tabs' )", 'array_slice( $configured_tabs, 0, 7 )', 'balt_media_center_resolve_source(', "['tax_query']", "'include_children' => true", "'-tab-' . $index", "'-panel-' . $index"]) {
            if (!render.includes(token)) throw new Error('Dynamic Media Center render missing: ' + token);
          }
          if (render.includes("'-panel-' . $type") || render.includes("'-tab-' . $type")) {
            throw new Error('Media Center tab DOM IDs must be based on row order');
          }
          if (block.name !== 'balt/media-center' || block.viewScript !== 'file:./view.js') {
            throw new Error('Media Center block registration is incorrect');
          }
          if (group.fields.map(f => f.name).join(',') !== 'eyebrow,heading,tabs') {
            throw new Error('Media Center block field schema is incorrect');
          }
          const tabs = group.fields.find(f => f.name === 'tabs');
          if (tabs.type !== 'repeater' || tabs.min !== 1 || tabs.max !== 7) {
            throw new Error('Media Center must allow 1–7 tabs');
          }
          if (tabs.sub_fields.map(f => f.name).join(',') !== 'source,label' ||
              tabs.sub_fields[0].type !== 'select' || tabs.sub_fields[0].ui !== 1) {
            throw new Error('Media Center tab source picker is incorrect');
          }
          for (const token of ["balt_media_types()", "get_posts(", "'numberposts'     => 3", 'balt_media_center_resolve_source(', 'get_the_post_thumbnail(', 'data-balt-media-panel', 'data-balt-media-tab']) {
            if (!render.includes(token)) throw new Error('Media Center renderer missing: ' + token);
          }
          for (const token of ['aria-selected', 'ArrowRight', 'ArrowLeft', 'Home', 'End', 'panels[i].hidden']) {
            if (!script.includes(token)) throw new Error('Media Center tab behavior missing: ' + token);
          }
          for (const css of ['theme/style.css', 'theme/style-editor.css']) {
            const stylesheet = readFileSync(css, 'utf8');
            for (const token of ['.btn-primary', '340px', 'aria-selected']) {
              if (!stylesheet.includes(token)) throw new Error('Media Center Tailwind utility missing: ' + token + ' in ' + css);
            }
          }
          NODE

      - name: Verify Image and Text Banner fields and styling
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const block = JSON.parse(readFileSync('theme/blocks/image-text-banner/block.json', 'utf8'));
          const group = JSON.parse(readFileSync('theme/acf-json/group_balt_image_text_banner.json', 'utf8'));
          const php = readFileSync('theme/blocks/image-text-banner/render.php', 'utf8');
          const util = readFileSync('tailwind/custom/utilities.css', 'utf8');
          const source = readFileSync('tailwind.css', 'utf8');

          if (block.name !== 'balt/image-text-banner' || block.acf.renderCallback !== 'balt_render_image_text_banner_block') {
            throw new Error('Image & Text Banner registration is incorrect');
          }
          for (const [name, type] of [['eyebrow', 'text'], ['heading', 'text'], ['subheading', 'text'], ['quote', 'textarea'], ['image', 'image'], ['buttons', 'repeater']]) {
            if (group.fields.find(field => field.name === name)?.type !== type) {
              throw new Error('Image & Text Banner missing ACF field: ' + name);
            }
          }
          const buttons = group.fields.find(field => field.name === 'buttons');
          if (buttons.min !== 0 || buttons.max !== 2 || buttons.sub_fields.length !== 1 || buttons.sub_fields[0].type !== 'link') {
            throw new Error('Banner buttons must be 0–2 links');
          }
          if (group.fields.find(field => field.name === 'image').return_format !== 'id') {
            throw new Error('Banner image must be returned as an attachment ID');
          }
          for (const token of ["get_field( 'quote' )", "get_field( 'image' )", 'lg:grid-cols-2', 'lg:order-1', 'lg:order-2', 'bg-linear-to-r', 'bg-linear-to-t', 'lg:min-h-[632px]', 'btn btn-red', 'btn btn-outline-subtle']) {
            if (!php.includes(token)) throw new Error('Image & Text Banner markup missing: ' + token);
          }
          if (!source.includes('@source "./theme/blocks/image-text-banner";') || !util.includes('@utility btn-red') || !util.includes('@utility btn-outline-subtle')) {
            throw new Error('Reusable button utilities or Tailwind source missing');
          }
          for (const stylesheet of ['theme/style.css', 'theme/style-editor.css']) {
            const css = readFileSync(stylesheet, 'utf8');
            for (const token of ['.btn-red', '.btn-outline-subtle', '632px', '390px']) {
              if (!css.includes(token)) throw new Error('Missing compiled Image & Text Banner utility: ' + token + ' in ' + stylesheet);
            }
          }
          NODE

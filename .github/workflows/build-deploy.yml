name: Validate theme build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate production build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run bundle

      - name: Lint PHP templates
        run: find theme -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Check homepage hero Tailwind utilities
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          for (const path of ['theme/style.css', 'theme/style-editor.css']) {
            const css = readFileSync(path, 'utf8');
            for (const token of ['.btn-outline', '.btn-gold', '865px', 'object-fit:cover']) {
              if (!css.includes(token)) throw new Error(`Missing hero utility ${token} in ${path}`);
            }
          }
          NODE

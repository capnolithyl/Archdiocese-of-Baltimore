name: Validate theme build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate production build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run bundle

      - name: Lint PHP templates
        run: find theme -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Check generated Tailwind block utilities
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          for (const path of ['theme/style.css', 'theme/style-editor.css']) {
            const css = readFileSync(path, 'utf8');
            for (const selector of ['slick-arrow', 'slick-dots', 'min-h-svh', 'grid-cols']) {
              if (!css.includes(selector)) {
                throw new Error(`Missing generated Tailwind utility: ${selector} in ${path}`);
              }
            }
          }
          NODE

name: Validate theme build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate production build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run bundle

      - name: Lint PHP templates
        run: find theme -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Check five block templates have no authored classes
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const dir = 'theme/dpi-blocks/blocks';
          let checked = 0;
          const visit = (path) => {
            for (const entry of readdirSync(path, { withFileTypes: true })) {
              const filename = join(path, entry.name);
              if (entry.isDirectory()) {
                visit(filename);
              } else if (filename.endsWith('.php')) {
                const php = readFileSync(filename, 'utf8');
                if (/\bclass\s*=\s*["']|["']class["']\s*=>/.test(php)) {
                  throw new Error(`Unexpected authored class in ${filename}`);
                }
                checked++;
              }
            }
          };
          visit(dir);
          if (checked < 8) throw new Error('Missing block templates');
          NODE
